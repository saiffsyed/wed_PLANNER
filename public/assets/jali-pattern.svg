<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  
  <defs>
    <pattern id="jali-bg" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#1a0a2e"></rect>
      <g stroke="#c9a84c" stroke-width="0.7" fill="none" opacity="0.35">
        <rect x="20" y="20" width="60" height="60"></rect>
        <rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)"></rect>
        <circle cx="50" cy="50" r="3" fill="#c9a84c" stroke="none" opacity="0.6"></circle>
        <circle cx="0" cy="0" r="3" fill="#c9a84c" stroke="none" opacity="0.6"></circle>
        <circle cx="100" cy="0" r="3" fill="#c9a84c" stroke="none" opacity="0.6"></circle>
        <circle cx="0" cy="100" r="3" fill="#c9a84c" stroke="none" opacity="0.6"></circle>
        <circle cx="100" cy="100" r="3" fill="#c9a84c" stroke="none" opacity="0.6"></circle>
      </g>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#jali-bg)"></rect>
</svg>